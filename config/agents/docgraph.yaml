# Document Graph deep agent — navigates the Ladybug Document Graph.
#
# Unified `agents:` form (genai-tk). The `cli docgraph agent` command loads this
# profile and runs it through `genai_graph.agent.create_docgraph_agent`, which
# injects the navigation tools and the colocated `genai_graph/agent/skills` at
# runtime (so --db / --folder / --llm overrides work without editing this file).

agent_defaults:
  type: react
  middlewares:
    - class: genai_tk.agents.langchain.middleware.deduplicate_middleware.DeduplicateToolCallsMiddleware
      tools: ["get_document_toc", "get_folder_toc", "list_documents", "search_sections", "get_section_content", "web_search"]
      mode: "stub"
    - class: genai_graph.agent.middleware.map_before_search.MapBeforeSearchMiddleware
      max_consecutive: 3
  checkpointer:
    type: none
  default_profile: docgraph

agents:
  docgraph:
    harness: langchain
    name: "Document Graph Agent"
    type: deep
    description: "Deep agent that navigates the Ladybug Document Graph (Folders → Documents → sections) to answer queries."
    llm: deepseek_v4flash@openrouter
    system_prompt: |
      You answer questions about an ingested document corpus by navigating the
      Document Graph with the provided tools. Read the `navigate-document-graph`
      and `document-graph-tools` skills for the exact navigation loop, then follow
      it: orient with get_folder_toc, get the map with get_document_toc, read only
      the relevant sections with get_section_content, and search_sections when you
      do not know where an answer lives. Cite section ids for every claim.
    tools: []
    skill_directories: []
    enable_planning: true
    enable_file_system: false
    recursion_limit: 120
    examples:
      - "What IT services is Alko requesting in the RFP?"
      - "Summarize the SLA requirements in the RFP folder."

  # Decision-model-navigated variant (docs/studies/decision_model_navigation.md):
  # a Clef-flash decision model replaces the LLM navigation loop — one
  # `navigate_folder` call returns a scored evidence pack; the agent only
  # synthesizes. Graph tools stay available for the low-confidence fallback.
  docgraph_decision:
    harness: langchain
    name: "Document Graph Agent (Decision-Navigated)"
    type: deep
    description: "Deep agent over decision-model-navigated evidence packs (DecisionRAG)."
    llm: deepseek_v4flash@openrouter
    system_prompt: |
      You answer questions about an ingested document corpus from the EVIDENCE PACK
      returned by `navigate_folder` (decision-model navigation over the Document
      Graph). Read the pack's sections, then answer; cite section ids for every
      claim and run arithmetic in python_interpreter when needed. Call
      `navigate_folder` again with refined `hints` describing what is missing
      (max 2 re-navigations); only if the pack still comes back low-confidence,
      fall back to `get_document_toc` / `get_section_content` / `search_sections`.
    tools:
      - factory: genai_graph.agent.decision_navigation.create_decision_navigation_tools
        decision_model: fast
        beam_width: 3
        top_r_sections: 6
        min_confidence: 0.5
        max_depth: 2
        candidate_cap: 48
        prefilter: hybrid
    skill_directories: []
    enable_planning: false
    enable_file_system: false
    # Backstop only (WrapUpMiddleware hard limit is the primary stop): ~2 steps per tool call.
    recursion_limit: 48
    examples:
      - "What IT services is Alko requesting in the RFP?"
      - "Summarize the SLA requirements in the RFP folder."
