################
# Application configuration file 
################

# Active profile — override with BLUEPRINT_CONFIG env var.
profile: ${oc.env:BLUEPRINT_CONFIG,ekg_local}

# :merge: lists gitignore-style patterns (relative to this directory) for YAML
# files to load and deep-merge into the config, in sorted order.
:merge:
  - "**/*.yaml"
  - "!demos/**"

# :profiles: provides inline per-profile overrides merged after :merge: files.
:profiles:
  ekg_local:
    llm:
      models:
        default: gpt_4o@openai
        fake: parrot_local@fake
        fast: llama31_8@groq
        coder: qwen25_coder32@openrouter
      cache: sqlite
      cache_path: ${paths.data_root}/llm_cache/langchain.db
    embeddings:
      models:
        default: ada_002@openai
        local: artic_22@ollama
      cache: ${paths.data_root}/hf_models
    kg_build:
      llms:
        default: gpt_4o_mini@edenai
        # "flash" is a large-context, cheap model used by `cli docgraph build --llm flash`
        # to discover document structure + summarize sections in one call.
        flash: deepseek_v4flash@openrouter
      embeddings:
        default: ada_002@edenai
    embeddings_store:
      default:
        backend: Chroma
        embeddings: default
        table_name_prefix: embeddings
        config:
          storage: ${paths.data_root}/vector_store
      chroma_indexed:
        backend: Chroma
        embeddings: default
        table_name_prefix: embeddings
        record_manager: sqlite:///${paths.data_root}/vector_store/record_manager_cache.sql
        config:
          storage: ${paths.data_root}/vector_store
      in_memory:
        backend: InMemory
        embeddings: default
        table_name_prefix: embeddings
      in_memory_chroma:
        backend: Chroma
        embeddings: default
        table_name_prefix: embeddings
        config:
          storage: '::memory:.'
      local_fast:
        backend: Chroma
        embeddings: local
        table_name_prefix: embeddings_local
        config:
          storage: ${paths.data_root}/vector_store_local
      postgres:
        backend: PgVector
        embeddings: default
        table_name_prefix: embeddings_pg
        config:
          postgres_url: ${paths.postgres}
          postgres_schema: public
    rag:
      embeddings_store: default
      chunker:
    documents:
      base: ./use_case_data
    monitoring:
      langsmith: true
      project: GenAI_demo
    kv_store:
      default:
        type: key_value.aio.stores.filetree.FileTreeStore
        args:
          data_directory: ${paths.data_root}/kv_store
    # Graph Database Configuration - Ladybug databases
    graph_db:
      default: ${paths.kg_outputs}/genai_graph.lbdb
      # Users can define additional databases (e.g., test, staging, prod)
      # Example: test: ${paths.kg_outputs}/genai_graph_test.lbdb

paths:
  data_root: ${oc.env:HOME}
  project: ${oc.env:PWD}
  src: ${paths.project}/genai_graph
  config: ${paths.project}/config
  demo_conf: ${paths.project}/config/demos
  models: ${oc.env:HOME}/.models
  postgres: postgresql://${oc.env:POSTGRES_USER,unknown_user}:${oc.env:POSTGRES_PASSWORD,password}@localhost:5432/ekg
  datasets: ${paths.project}/use_case_data
  ekg_data: ${paths.data_root}/OneDrive/KORTEX_EKG/proto/input_data
  kg_outputs: ${oc.env:HOME}/kg_outputs

#### 
# User Interface Configuration : list of Streamlit pages, authentication, ... 
####    
ui:
  app_name: Enterprise Knowledge Graph Demos
  pages_dir: ${paths.src}/webapp/pages
  navigation:
    Settings:
      - settings/welcome.py
      - settings/configuration.py
      - settings/MCP_servers.py
    Data Flows:
      - path: demos/kg_lineage.py
        name: "Markdown Files Lineage"
      - path: demos/kg_tables.py
        name: "Data Tables Imports"
      - path: demos/kg_schema_visualization.py
        name: "Schema Visualization"
      - path: demos/external_web_page.py
        name: "Architecuture"
    Knowledge Graph:
      - path: demos/reAct_agent.py
        name: "ReAct Agent"
      - path: demos/kg_query.py
        name: "Cypher/NL Query "
      - path: demos/kg_visualization.py
        name: "Graph Visualization"
      - path: demos/kg_warnings.py
        name: "Creation Warnings"

#### 
# Authentication
####  
auth:
  enabled: ${oc.env:BASIC_AUTH_ENABLED,false}
  config_file: ${paths.config}/basic_auth.yaml

#####
# Command Line Interface configuration
####
cli:
  commands:  # List modules:functions to register CLI commands
    - genai_tk.cli.commands_core.CoreCommands
    - genai_tk.cli.commands_info.InfoCommands
    - genai_tk.cli.commands_test.TestCommands
    - genai_tk.cli.commands_skills.SkillsCommands
    - genai_tk.workflow.commands.WorkflowCommands
    - genai_tk.extra.commands_extra.ExtraCommands
    - genai_tk.workflow.rag.commands_rag.RagCommands
    - genai_tk.agents.commands_agents.AgentCommands
    - genai_tk.extra.structured.commands_baml.BamlCommands
    - genai_graph.core.commands_docgraph.DocGraphCommands
    - genai_graph.core.commands_bench.BenchCommands
    - genai_tk.main.cli.register_commands

test:
  notebooks: notebooks/

logging:
  format: "<cyan>{time:HH:mm:ss}</cyan>-<level>{level: <7}</level> | <magenta>{file.name}</magenta>:<green>{line} <italic>{function}</italic></green>- <level>{message}</level>"
  level: INFO
  backtrace: true  # Should be False in production


