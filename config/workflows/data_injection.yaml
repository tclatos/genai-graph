# ---------------------------------------------------------------------------
# Generic data-injection workflows  (DSL v2)
# ---------------------------------------------------------------------------
# Domain-agnostic ingestion pipeline built on the ingest router: route-table
# rules (config/ingest_routes.yaml) map each source item — file path or URL —
# to a workflow (markdownize, web-page fetcher, …); matched groups run in
# parallel and converge to Markdown under md_output_dir.
#
# Projects that import genai-graph (e.g. ekg-atos, rfq_pricing) define their
# own route tables and presets (data paths, KG factory configs) in their own
# config/.
#
# Usage:
#   cli workflow run markdownize_documents --set sources=./docs --set md_output_dir=./md
#   cli workflow run document_to_kg --dry-run
#   cli workflow list
# ---------------------------------------------------------------------------

workflows:

  office2pdf_documents:
    description: "Convert Office documents (PowerPoint, Excel) to PDF"
    run: genai_tk.workflow.prefect.flows.office2pdf_flow.office2pdf_flow
    defaults:
      batch_size: 5
      cache_dir: null
    params:
      sources: {required: true}
      pdf_output_dir: {required: true}

  markdownize_documents:
    description: "Convert directories/zips/files (raw docs or pre-existing Markdown) to Markdown"
    run: genai_tk.workflow.markdownize.markdownize_flow
    defaults:
      batch_size: 5
      cache_dir: null
      profile: default
    params:
      sources: {required: true}
      md_output_dir: {required: true}
      force_stage: {required: false}

  json_document:
    description: "Convert structured JSON documents (benchmark corpora) to Markdown"
    run: genai_graph.orchestration.ingest_flows.json_document_flow
    params:
      sources: {required: true}
      md_output_dir: {required: true}
      force_stage: {required: false}

  document_to_kg:
    description: "End-to-end pipeline: sources (files/dirs/zips/URLs) routed to workflows -> Markdown -> single-factory KG build"
    pipeline:
      - id: ingest_dispatch
        run: genai_tk.workflow.routing.dispatcher.ingest_dispatch_step
        with:
          sources: '${values.sources}'
          md_output_dir: '${values.md_output_dir}'
          routes: '${values.routes}'
          force_stage: '${values.force_stage}'

      - id: create_kg
        run: kg_build
        after: [ingest_dispatch]
        with:
          graph: '${values.graph}'
          kg_name: '${values.kg_name}'
          delete_first: '${values.delete_first}'
          export_html: '${values.export_html}'
          force_stage: '${values.force_stage}'
    defaults:
      routes: default
      kg_name: inline
      delete_first: false
      export_html: true
    params:
      sources: {required: true}
      md_output_dir: {required: true}
      graph: {required: true}
