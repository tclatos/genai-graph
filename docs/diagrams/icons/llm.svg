<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Mauve Gradient for Text -->
    <linearGradient id="mauveText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Mauve Gradient for Head Silhouette -->
    <linearGradient id="mauveHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#581c87" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Thinking Head Profile (Mauve Outline & Glow) -->
  <g filter="url(#dropShadow)">
    <path d="M 200 440 
             C 210 390 200 350 170 330 
             C 150 315 135 290 135 250 
             C 135 160 200 100 285 100 
             C 365 100 425 155 425 240 
             C 425 310 380 355 370 380 
             C 360 405 365 425 370 440" 
          fill="none" 
          stroke="url(#mauveHead)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.85" />

    <!-- Neural Network Nodes inside Brain Area -->
    <!-- Connections -->
    <g stroke="url(#glowAccent)" stroke-width="2.5" opacity="0.4" stroke-dasharray="4 4">
      <line x1="220" y1="210" x2="270" y2="160" />
      <line x1="270" y1="160" x2="330" y2="180" />
      <line x1="270" y1="160" x2="290" y2="230" />
      <line x1="330" y1="180" x2="360" y2="230" />
      <line x1="290" y1="230" x2="360" y2="230" />
      <line x1="220" y1="210" x2="290" y2="230" />
    </g>

    <!-- Synapse Nodes -->
    <g fill="#f0abfc" opacity="0.7">
      <circle cx="220" cy="210" r="6" />
      <circle cx="270" cy="160" r="7" />
      <circle cx="330" cy="180" r="5" />
      <circle cx="290" cy="230" r="8" fill="#f472b6" />
      <circle cx="360" cy="230" r="6" />
    </g>
  </g>

  <!-- Central "LLM" Typography -->
  <text x="260" y="305" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="110" 
        letter-spacing="4"
        fill="url(#mauveText)" 
        stroke="#581c87" 
        stroke-width="3"
        filter="url(#dropShadow)">LLM</text>

  <!-- Sparkle / Idea Symbol -->
  <path d="M 345 130 
           Q 345 145 360 145 
           Q 345 145 345 160 
           Q 345 145 330 145 
           Q 345 145 345 130 Z" 
        fill="#f472b6" />
</svg>
