[project]
name = "genai_graph"
version = "0.1.2"
description = "GenAI Graph - Hybrid GraphRAG framework built on genai-tk"
authors = [{ name = "Thierry Caminel", email = "thierry.caminel@atos.net" }]
requires-python = ">=3.12"
dependencies = [
    # GenAI Toolkit - core AI components
    # For local development with unpushed genai-tk changes, use local path:
    # "genai-tk @ file:///home/tcl/prj/genai-tk",
    # For production or when using GitHub version:
    "genai-tk",
    # Application framework dependencies
    "pydantic>=2.7.0,<3",         # Data validation framework
    "devtools>=0.12.2",           # Development utilities
    "loguru>=0.7.3",              # Logging library
    "typer>=0.13.0",              # CLI framework
    "omegaconf>=2.3.0",           # Configuration management
    "fastapi[standard]>=0.115.6", # Web framework
    "rich[jupyter]>=13.9.4",      # Terminal formatting
    "universal-pathlib>=0.2.6",   # Cross-platform paths
    "pip>=25.1.1",                # Package installer
    # "modal>=1.0.5", # Serverless cloud platform
    "python-dotenv>=1.1.1",     # Environment variables
    "beartype>=0.21.0",         # Run time type checking
    "baml-py==0.223.0",         # FIXED VERSION to avoid to re-generate BAML sources with each new version of baml-py. Update this version when you want to update the BAML sources.
    "langchain-classic>=1.0.0",
    # "gpt-researcher>=0.13.3",
    "pandas>=2.3.3",
    "langchain-litellm>=0.3.2",
    "case-converter>=1.2.0",
    # "pgvector>=0.4.2",
    "psycopg[binary, pool]>=3.3.2",
    "prefect>=3.6.7",
    "prefect-yaml",
    "sqlmodel>=0.0.31",
    "xxhash>=3.6.0",
    "baml-lib>=0.42.0",
    "chonkie>=1.5.2",
    "tokenizers>=0.21.0",           # Hugging Face tokenizers (for chonkie)
    "lingua-language-detector>=2.0.2", # Accurate language detection
    "ladybug>=0.16.1",
    "markdown-it-py>=3.0.0",        # CommonMark parser with line-number tracking (Markdown Knowledge Tree)
    "streamlit-tree-select2>=0.0.7",
]

[project.urls]
Homepage = "https://github.com/tclatos/genai-graph"
Repository = "https://github.com/tclatos/genai-graph"


[project.optional-dependencies]
# Agentic harness — required to RUN `cli docgraph agent` (type: deep agents).
# Install with: uv sync --extra harnessing
harnessing = ["genai-tk[harnessing]"]

# Everything (for full installs / CI images)
all = ["genai-graph[harnessing]"]


[dependency-groups]
# UI and web application dependencies

extra = [
    # Additional AI capabilities 

    "tavily-python>=0.7.12",    # LLM optimized search engine
    "langchain-tavily>=0.2.11",
    "ddgs>=9.7.0",              # DuckDuckGo search API
    "openpyxl>=3.1.5",          # Excel file handling
    "fuzzysearch>=0.8.0",       # Fuzzy string matching
    # "markpickle>=1.6.1",        # Markdown serialization
]

ui = [
    "uvicorn>=0.34.0",         # ASGI server
    "sse-starlette>=2.1.0",    # Server-sent events
    "streamlit[pdf]>=1.49",    # Web app framework
    "streamlit-monaco>=0.1.3", # Code editor component
]
demos = [
    "presidio-analyzer>=2.2.0",   # PII detection
    "presidio-anonymizer>=2.2.0", # PII anonymization
    "Faker>=25.0.0",              # Fake data generation
    "yfinance>=0.2.38",           # Yahoo Finance API
    "matplotlib>=3.9.0,<4",       # Plotting library
    "sqlalchemy>=2.0.29",         # SQL toolkit
    "pypdf>=5.1.0,<6",            # PDF processing
    "scikit-learn>=1.6.1",        # ML algorithms
]

dev = [
    "ruff>=0.9.1",       # Python linter
    "pytest>=8.1.1",     # Testing framework
    "ipykernel>=6.29.4", # Jupyter kernel
    "ipywidgets>=8.1.2", # Jupyter widgets
    "grandalf>=0.8",     # Graph layout algorithms
    "pytest-cov>=7.1.0",
    "pytest-beartype>=0.2.0", # Runtime type checking for pytest
]

# git-only genai-tk reference for this repo's own `uv sync` (the published
# requirement is bare — see the NOTE above [build-system]). Root-only: consumers
# choose their own genai-tk source and are never affected by this pin.
toolkit = [
    "genai-tk @ git+https://github.com/tclatos/genai-tk@main",
]

[tool.uv.sources]
prefect-yaml = { git = "https://github.com/tclatos/prefect-yaml", branch = "main" }

[tool.uv]
package = true
default-groups = ["ui", "demos", "extra", "dev", "toolkit"]
override-dependencies = [
    "mcp>=2.0.0",
]
constraint-dependencies = [
    "ipython<9",      # 9.x has circular import (ultratb → from IPython import get_ipython during __init__)
    "requests<2.34",  # 2.34.x has broken compat.py (missing JSONDecodeError export)
#    "langsmith<0.9",  # 0.9.x has circular import in _openapi_client
    "alembic<1.18",   # 1.18.x has missing PriorityDispatcher (breaks Prefect)
    "openai<2.44",    # 2.44.0 has circular import in _utils/_files
    # genai-tk[harnessing] carries deerflow-harness as a direct URL requirement; uv requires
    # consumers resolving genai-tk from git to express transitive URL dependencies in constraints
    "deerflow-harness @ git+https://github.com/bytedance/deer-flow@795af20a6b79b22fd9e95f674554605c5bfb6cdc#subdirectory=backend/packages/harness",
]

# NOTE: genai-tk is a bare requirement in [project.dependencies] on purpose.
# Do NOT add a [tool.uv.sources] entry for it here: uv applies a dependency
# package's sources to consumers resolving it from a path/git checkout, and a
# baked URL (git or relative path) then CONFLICTS with whatever source the
# consumer chooses (sibling editable checkouts, git pin, ...). The `toolkit`
# group below carries the git reference for this repo's own `uv sync` instead —
# dependency-groups are root-only, so consumers never inherit it. The README
# quick start also works unchanged because it `uv add`s genai-tk explicitly.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["genai_graph"]
exclude = ["genai_graph/skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "genai_graph/skills"

[tool.ruff]
builtins = ["ic", "debug"]
line-length = 120          # default is 88
exclude = [
    "notebooks/", # Jupyter notebooks (may have parse errors / out-of-order cells)
    ".venv/",
]

[tool.ruff.format]
docstring-code-format = true # Formats code blocks in docstrings

[tool.ruff.lint]
# Lint rule configuration:
select = [
    "E", # Pycodestyle errors (PEP 8 style violations)
    "F", # Pyflakes errors (basic syntax and logic errors)
    "I", # isort rules (import sorting)
    "W", # Pycodestyle warnings (style issues that aren't errors)
    "B", # Bugbear - catches common bugs and anti-patterns                                                                                      
    # "N", # Naming conventions                                                                                                                                  
    "C",     # Better comprehensions    
    "ASYNC", # Async 
    "ANN",   # Annotations
    "PIE",
    "PD",    # Pandas
    "FURB",  #refurbishing and modernizing
    "UP",    # pyupgrade - modernize syntax for the target Python version
    "SIM",   # flake8-simplify - simplifiable conditionals/comprehensions
    "RUF",   # Ruff-specific rules
]

ignore = [ # Ignored linter rules: 
    "E501",   #Line too long (we use 120 chars instead of default 88) 
    "W291",   # Trailing whitespace 
    "W293",   # white spaces "
    "B006",   # Do not use mutable data structures for argument defaults
    "C901",   # Function is too complex , 
    "ANN401", # Annotated with Any
    "ANN002", # Annotate *args
    "ANN003", # Annotate **kwarg
    "ANN201", # Missing return type
    "ANN202", # Missing return info
    "COM812", # Trailing comma missing — conflicts with the ruff formatter
    "ISC001", # Implicit string concatenation on one line — conflicts with the ruff formatter
    "RUF012", # Mutable class attributes should be annotated with `ClassVar` — noisy on Pydantic/SQLModel fields
    "RUF001", # Ambiguous unicode character (string) — em-dashes/curly quotes are used intentionally throughout docstrings
    "RUF002", # Ambiguous unicode character (docstring) — same rationale as RUF001
    "RUF003", # Ambiguous unicode character (comment) — same rationale as RUF001
]

[tool.ruff.lint.per-file-ignores]
# Tests: relax annotations, docstrings, magic values, security, and assertion style
"tests/**" = [
    "ANN001", # Missing type annotation for function argument
    "ARG002", # Unused method argument — common for pytest fixtures
    "D1",     # Missing docstrings
    "PLR2004",# Magic value used in comparison — fine in test assertions
    "S101",   # Use of `assert` detected
    "S311",   # Pseudo-random generator not suitable for security — fine in tests
]
# Scripts / notebooks: allow prints, broad exceptions, and standalone modules
"scripts/**" = [
    "BLE001", # Blind exception catch — resilience in standalone scripts
    "INP001", # Missing `__init__.py` — scripts are standalone
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
reportTypedDictNotRequiredAccess = false # Avoid warnings in LangGraph

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/integration_tests"]
python_files = ["test_*.py", "*_test.py"]
beartype_packages = [
    # Conservative, mostly-Pydantic package subset — safe to runtime-check.
    "genai_graph.kg.schema",
    "genai_graph.orchestration",
    "genai_graph.utils",
]
markers = [
    "unit: unit tests (no external services)",
    "integration: integration tests (local services like Ladybug, no API keys)",
    "real_models: tests that call real LLM/embedding APIs (opt-in)",
]


[project.scripts]
cli = "genai_tk.main.cli:main"
